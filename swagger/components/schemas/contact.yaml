type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 65ca67e7ae7f10c88b598384
  name:
    description: 'Contact name'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "The contact's phone number"
    type: string
    example: '+380000000008'
  email:
    description: 'Contact email'
    type: string
    example: 'example@gmail.com'
  isFavourite:
    description: 'Whether the contact is a favorite'
    type: boolean
    default: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    default: 'personal'
  userId:
    description: 'Contact owner id'
    type: string
    example: 65ca67e7ae7f10c88b598384
  photo:
    description: 'Link to contact photo'
    type: string
    example: 'https://res.cloudinary.com/contacts-cloud/image/upload/v1742406769/cloud_folder/njfhuseawrewg4yzvq84.jpg'
  createdAt:
    description: 'Contact created at'
    type: string
    format: date-time
  updatedAt:
    description: 'Contact last update'
    type: string
    format: date-time
