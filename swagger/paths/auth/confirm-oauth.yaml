tags:
  - Auth
summary: 'Confirm Google OAuth'
operationId: loginOrSignUpWithGoogle
description: 'Sign up or login with Google OAuth code'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - code
        properties:
          code:
            type: string
            example: '4/0Ab_5qllMJBeHEyWr18_WKhSw4RWw_zky5H6dr6sfVvXpbmkERV23XdWnFreKx7Cd4-j79A'
responses:
  '200':
    description: 'Successful operation'
    content:
      application/json:
        schema:
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully logged in via Google OAuth!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'URa+Si9YcG3JTyl6uQ77/a6cAtTUVIHcp80gMc+Y'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
    description: 'invalid_grant'
