tags:
  - Auth
summary: 'Get Google OAuth url'
operationId: getGoogleOAuthUrl
description: 'Get Google OAuth url for login or sign up'
security: []
responses:
  '200':
    description: 'Successful operation'
    content:
      application/json:
        schema:
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully get Google OAuth url!'
            data:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?scope=https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%3A%2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile&response_type=code&client_id=459893735637-gff83o7lb1vfb2ijqcj8clfn5ite3dqp.apps.googleusercontent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fconfirm-google-auth'
  '404':
    $ref: '../../components/responses/404.yaml'
    description: 'Route not found'
  '500':
    $ref: '../../components/responses/500.yaml'
