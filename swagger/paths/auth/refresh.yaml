tags:
  - Auth
summary: Refresh user's session
operationId: refreshUsersSession
description: Refreshes the user`s session using the refresh token stored in cookies
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - sessionId
          - refreshToken
        properties:
          sessionId:
            type: string
            example: '67dd73930820a621863ad82b'
          refreshToken:
            type: string
            example: 'ksIErcdA0oBwLX79f4bPcYXWKyEX/hcN6OcDU1Ll'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed a session!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  description: The new access token for the user session
                  example: 'ksIErcdA0oBwLX79f4bPcYXWKyEX/hcN6OcDU1Ll'
  '401':
    $ref: '../../components/responses/401.yaml'
    description: '"Session not found" or "Session token expired"'
  '500':
    $ref: '../../components/responses/500.yaml'
