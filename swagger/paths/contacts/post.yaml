tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Create a new contact
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+380671338855'
          email:
            type: string
            example: 'example@gmail.com'
          isFavourite:
            type: boolean
            default: false
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Success. Created
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
    description: 'Bad request'
  '401':
    $ref: '../../components/responses/401.yaml'
    description: 'Unauthorized'
  '500':
    $ref: '../../components/responses/500.yaml'
